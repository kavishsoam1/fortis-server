apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-services-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: health-services.example.com  # Change this to your domain in production
    http:
      paths:
      - path: /api/patients(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: patient-service
            port:
              number: 3001
      - path: /api/doctors(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: doctor-service
            port:
              number: 3002
      - path: /api/appointments(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: appointment-service
            port:
              number: 3003
